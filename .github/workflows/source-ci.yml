name: Source CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fortis_approvals/requirements-owner.txt

      - name: Install pinned owner-runtime dependencies
        run: python -m pip install -r fortis_approvals/requirements-owner.txt

      - name: Compile source
        run: python -B -m compileall -q fortis_approvals

      - name: Verify source manifests
        run: python scripts/update-source-manifests.py --check

      - name: Run offline security and integration tests
        run: bash scripts/test-source.sh

      - name: Check whitespace errors in the commit diff
        shell: bash
        run: |
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            git diff --check HEAD^1 HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

  audit-projections:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse audit scripts and check projections in Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'fortis_approvals/deploy/Audit-Modularized-Cutover-ReadOnly-20261105.ps1',
            'fortis_approvals/deploy/Confirm-Modularized-Cutover-Metadata-20261105.ps1',
            'fortis_approvals/deploy/Run-GitHub-Pilot-E2E.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
          & $files[0] -SelfTest
          & $files[2] -Mode SelfTest

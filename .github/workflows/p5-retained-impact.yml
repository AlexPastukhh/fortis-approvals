# Source-only P5 semantic integration gate. No secrets or deployment.
name: P5 Retained Impact
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p5-retained-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: Checkout reviewed public validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AlexPastukhh/fortis-release-impact-action
          ref: 8b82564728c55807c57d1c9e1f0f974ea14fd6d6
          fetch-depth: 1
          persist-credentials: false
          path: validator
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact revisions and install reviewed validator requirements
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C validator rev-parse HEAD)" = "8b82564728c55807c57d1c9e1f0f974ea14fd6d6"
          test "$(sha256sum validator/tools/release/requirements.txt | cut -d ' ' -f 1)" = "c6510e2d2bfbd08ae31ee9d1042c91e2d748cca5b1c58a6fd879ae32f5fb073c"
          python -m pip install --disable-pip-version-check -r validator/tools/release/requirements.txt
      - name: Run required retained Impact semantic cases (no skips)
        shell: bash
        working-directory: source
        env:
          FORTIS_TEST_RELEASE_VALIDATOR_ROOT: ${{ github.workspace }}/validator
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/test-p5-retained-impact.py

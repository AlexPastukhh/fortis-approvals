# Source candidate for Fortis release planning; not an authorization to deploy.
# Two independent target identities: Gateway image and owner Windows controller.
# Image inputs are derived conservatively from active Manage-Integrations.ps1
# (Dockerfile-Gateway-Modularized-Candidate), not historical pilot Dockerfiles.
schemaVersion: 1
repository: fortis-approvals
buildUnits:
  - id: primary-gateway-image
    artifactType: docker-image
    recipe: fortis_approvals/deploy/Dockerfile-Gateway-Modularized-Candidate
    inputs:
      - fortis_approvals/deploy/Dockerfile-Gateway-Modularized-Candidate
      - .dockerignore
      - fortis_approvals/requirements-owner.txt
      - fortis_approvals/__init__.py
      - fortis_approvals/diagnostic_contract.py
      - fortis_approvals/core.py
      - fortis_approvals/owner_auth.py
      - fortis_approvals/owner_portal.py
      - fortis_approvals/owner_shell.py
      - fortis_approvals/powershell_machine.py
      - fortis_approvals/powershell_owner_mount.py
      - fortis_approvals/owner_shell_release.py
      - fortis_approvals/owner_shell_portal.py
      - fortis_approvals/incidents.py
      - fortis_approvals/repo_action_contract.py
      - fortis_approvals/repo_ingress.py
      - fortis_approvals/r5_read_candidate.py
      - fortis_approvals/r5_read_server.py
      - fortis_approvals/r7_unified_candidate.py
      - fortis_approvals/r7_unified_server.py
      - fortis_approvals/a3_server.py
      - fortis_approvals/server.py
      - fortis_approvals/integrations/**
      - fortis_approvals/extensions/**
      - fortis_approvals/clients/**
      - fortis_approvals/workflow/__init__.py
      - fortis_approvals/workflow/common.py
      - fortis_approvals/workflow/store.py
      - fortis_approvals/workflow/git_backend.py
      - fortis_approvals/workflow/adapters.py
      - fortis_approvals/workflow/ingress.py
      - fortis_approvals/workflow/incident_read.py
      - fortis_approvals/workflow/error_diagnostics.py
      - fortis_approvals/workflow/artifact_diagnostics.py
      - fortis_approvals/workflow/runtime.py
      - fortis_approvals/static/**
      - fortis_approvals/deploy/github_pilot_helpers.py
      - fortis_approvals/deploy/image_offline_smoke.py
  # P3.4 source definition only; no publisher image is built or activated here.
  - id: publisher-runner-image
    artifactType: docker-image
    recipe: fortis_approvals/deploy/Dockerfile-P3-Release-Label-Publisher
    inputs:
      - fortis_approvals/deploy/Dockerfile-P3-Release-Label-Publisher
      - .dockerignore
      - fortis_approvals/__init__.py
      - fortis_approvals/core.py
      - fortis_approvals/diagnostic_contract.py
      - fortis_approvals/repo_action_contract.py
      - fortis_approvals/repo_ingress.py
      - fortis_approvals/clients/*.py
      - fortis_approvals/workflow/*.py
      - fortis_approvals/integrations/*.py
      - fortis_approvals/integrations/github/*.py
      - fortis_approvals/integrations/github/repo_client/*.py
      - fortis_approvals/integrations/github/gateway/__init__.py
      - fortis_approvals/integrations/github/gateway/transport.py
      - fortis_approvals/integrations/github/gateway/pr_create_diagnostic.py
      - fortis_approvals/integrations/sonarcloud/__init__.py
      - fortis_approvals/integrations/sonarcloud/analysis_contract.py
      - fortis_approvals/integrations/sonarcloud/contract.py
      - fortis_approvals/integrations/sonarcloud/gateway/__init__.py
      - fortis_approvals/integrations/sonarcloud/gateway/analysis_reader.py
targets:
  - id: fortis-gateway
    buildUnit: primary-gateway-image
    deployment:
      kind: owner-controlled
      procedure: docs/use-cases/releases.md
      environments: [production]
    verification:
      - source-ci
      - owner-selftest
      - protected-check-apply
      - live-readback
      - backup-promote
  - id: gateway-owner-controller
    inputs:
      - fortis_approvals/deploy/Manage-Integrations.ps1
      - fortis_approvals/deploy/Run-GitHub-Pilot-E2E.ps1
      - fortis_approvals/deploy/Primary-Gateway.ps1
      - fortis_approvals/deploy/Provider-Credentials.ps1
    deployment:
      kind: windows-source
      procedure: docs/PRIMARY-GATEWAY-OPERATIONS.md
      environments: [windows-owner]
    verification:
      - windows-source-exact-sha
      - owner-powershell-selftest
  # Separate, disabled P3.4 owner-controlled runner (not Primary Gateway).
  - id: release-label-publisher
    buildUnit: publisher-runner-image
    deployment:
      kind: owner-controlled
      procedure: docs/P3-4-PUBLISHER-ISOLATED-RUNTIME.md
      environments: [production]
    verification:
      - source-ci
      - owner-isolation-attestation
      - publisher-grant-capabilities
      - owner-one-shot-webAuthn-pilot
      - original-receipt-and-label-readback
noDeploymentPaths:
  - release/**
  # WorkflowClient is a Repo-side machine client; the Primary image COPY
  # includes only the native workflow server modules and not this file.
  - fortis_approvals/workflow/client.py
  - fortis_approvals/workflow/powershell_client.py
  - fortis_approvals/workflow/intents.py
  # Offline P5 separate Registry contract, not packaged into any current
  # runtime. A real Registry image/target needs a separately reviewed catalog.
  - fortis_approvals/registry/__init__.py
  - fortis_approvals/registry/boundary.py
  - fortis_approvals/registry/state_journal.py
  - fortis_approvals/registry/state_journal_v2.py
  - fortis_approvals/registry/recovery_snapshot.py
  - fortis_approvals/registry/checkpoint_cas.py
  - fortis_approvals/registry/recovery_reconcile.py
  - fortis_approvals/registry/owner_peer_boundary.py
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - AGENTS.md
  - .editorconfig
  - .gitattributes
  - .gitignore
  - .github/**
  - docs/**
  - scripts/**
  - fortis_approvals/README.md
  # Only the deployment index Markdown is documentation: never blanket-ignore
  # deploy/ because it contains the live owner controller and image helpers.
  - fortis_approvals/deploy/README.md
  - fortis_approvals/evidence/**
  - fortis_approvals/tests/**
